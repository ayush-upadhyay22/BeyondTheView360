<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nazara – 360° tours</title>
<style>
:root{--bg:#eef1f2;--p:#fff;--ink:#14212a;--mut:#5d6b74;--ln:#d5dcdf;--acc:#c77d0a;--af:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c1519;--p:#121f25;--ink:#e6edf0;--mut:#8da0a9;--ln:#22343c;--acc:#f2a93b;--af:#1a1205}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--p);border-bottom:1px solid var(--ln)}
header a{color:var(--ink);font-weight:700;font-size:18px;text-decoration:none}
button,.b{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--p);color:var(--ink);border-radius:9px;padding:7px 12px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--af);font-weight:600}
input,select{font:inherit;padding:7px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.home{padding:20px;max-width:900px;width:100%;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px;cursor:pointer}
.card small{color:var(--mut)}
.edit{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px}
#stage{position:relative;background:#000;overflow:hidden;touch-action:none;min-height:0;flex:1}
#stage.add{cursor:crosshair}canvas{display:block;width:100%;height:100%}
.hs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hs button{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-50%,-50%);border:0;border-radius:99px;background:rgba(10,18,22,.8);color:#fff;padding:6px 12px;font-size:13px}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px;overflow:auto;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.nav button{white-space:nowrap;background:rgba(10,18,22,.8);color:#fff;border-color:transparent}
.nav button.on{background:#f2a93b;color:#1a1205}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:#cbd5da;text-align:center;padding:20px}
aside{background:var(--p);border-left:1px solid var(--ln);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
aside .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:10px;padding:6px;cursor:pointer}
.sc.on{border-color:var(--acc)}.sc img{width:56px;height:28px;object-fit:cover;border-radius:5px;background:#000}
.sc span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc em{font-size:12px;color:var(--mut)}
textarea{width:100%;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:6px}
.err{color:#d64545;font-size:12px}
@media(max-width:760px){.edit{grid-template-columns:1fr;grid-template-rows:55vh 1fr}aside{border-left:0;border-top:1px solid var(--ln)}}
</style></head><body>
<header><a href="/">Nazara</a><span id="hdr"></span></header>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),D=Math.PI/180;
const api=(u,o)=>fetch(u,o).then(r=>r.ok?(r.status===204?null:r.json()):Promise.reject(r));
const send=(u,b,m='POST')=>api(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let tour=null,cur=0,editMode=false,addMode=false,poll=null;

/* ---------- 360 viewer ---------- */
let R,S,C,mat,lon=0,lat=0,fov=75,auto=true,drag=false,hsEl=[],ready=false,onClick=null;
function viewer(host){
  host.innerHTML='<canvas></canvas><div class="hs"></div><div class="msg" hidden></div><div class="nav"></div>';
  const cv=host.querySelector('canvas');
  R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
  S=new THREE.Scene();C=new THREE.PerspectiveCamera(75,1,.1,1100);
  const g=new THREE.SphereGeometry(500,64,40);g.scale(-1,1,1);mat=new THREE.MeshBasicMaterial({color:0});S.add(new THREE.Mesh(g,mat));
  let p=null,mv=0;
  host.onpointerdown=e=>{if(e.target.closest('button'))return;p=[e.clientX,e.clientY];mv=0;drag=true;host.setPointerCapture(e.pointerId)};
  host.onpointermove=e=>{if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p=[e.clientX,e.clientY];mv+=Math.abs(dx)+Math.abs(dy);
    const k=fov/host.clientHeight*D;lon-=dx*k;lat=Math.max(-1.4,Math.min(1.4,lat+dy*k))};
  host.onpointerup=e=>{if(p&&mv<6&&onClick){const r=host.getBoundingClientRect(),v=new THREE.Vector3((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1,.5).unproject(C).normalize();onClick(Math.atan2(v.z,v.x),Math.asin(v.y))}p=null;drag=false};
  host.onwheel=e=>{e.preventDefault();fov=Math.max(30,Math.min(100,fov+e.deltaY*.05))};
  (function loop(){requestAnimationFrame(loop);const w=host.clientWidth,h=host.clientHeight;
    if(cv.width!==w*R.getPixelRatio()||cv.height!==h*R.getPixelRatio()){R.setSize(w,h,false);C.aspect=w/h}
    if(auto&&!drag)lon+=.0011;C.fov=fov;C.updateProjectionMatrix();
    const c=Math.cos(lat);C.lookAt(c*Math.cos(lon),Math.sin(lat),c*Math.sin(lon));R.render(S,C);
    const look=new THREE.Vector3();C.getWorldDirection(look);
    hsEl.forEach(({el,h})=>{const c=Math.cos(h.lat),v=new THREE.Vector3(c*Math.cos(h.lon),Math.sin(h.lat),c*Math.sin(h.lon));
      if(v.dot(look)<.1){el.style.display='none';return}el.style.display='';v.multiplyScalar(400).project(C);
      el.style.left=(v.x+1)/2*w+'px';el.style.top=(1-v.y)/2*h+'px'})})();
}
function showScene(i){
  cur=i;const s=tour.scenes[i],host=$('#stage'),msg=host.querySelector('.msg'),box=host.querySelector('.hs');
  box.innerHTML='';hsEl=[];
  host.querySelectorAll('.nav button').forEach((b,k)=>b.classList.toggle('on',k===i));
  if(!s){msg.hidden=false;msg.textContent=editMode?'Upload a 2:1 360° photo to begin':'This tour has no scenes yet';return}
  if(s.status!=='ready'){msg.hidden=false;msg.textContent=s.status==='failed'?s.error:'Processing…';mat.map=null;mat.color.set(0);mat.needsUpdate=true;return}
  msg.hidden=true;
  const w=[...s.widths].reverse().find(x=>x<=(innerWidth<800?2048:4096))||s.widths[0];
  new THREE.TextureLoader().load(`/img/${s.id}/w${w}`,t=>{t.minFilter=THREE.LinearFilter;mat.map=t;mat.color.set(0xffffff);mat.needsUpdate=true});
  s.hotspots.forEach(h=>{const t=tour.scenes.find(x=>x.id===h.to);if(!t)return;const b=document.createElement('button');b.textContent='› '+t.name;
    b.onclick=()=>{if(addMode){s.hotspots=s.hotspots.filter(x=>x!==h);saveHs(s);showScene(i)}else showScene(tour.scenes.indexOf(t))};
    box.appendChild(b);hsEl.push({el:b,h})});
}
const saveHs=s=>send(`/api/scenes/${s.id}/hotspots`,s.hotspots,'PUT');
function nav(){const n=$('#stage .nav');n.innerHTML='';tour.scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>showScene(i);n.appendChild(b)})}

/* ---------- pages ---------- */
async function home(){
  clearInterval(poll);$('#hdr').textContent='';
  const list=await api('/api/tours');
  $('#app').innerHTML=`<div class="home"><div class="row"><input id="nt" placeholder="New tour name"> <button class="pri" id="mk">Create tour</button></div><div class="cards"></div></div>`;
  list.forEach(t=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<b></b><br><small>${t.n} scene${t.n==1?'':'s'}</small>`;c.querySelector('b').textContent=t.title;c.onclick=()=>location.hash='#/tour/'+t.id;$('.cards').appendChild(c)});
  $('#mk').onclick=async()=>{const t=await send('/api/tours',{title:$('#nt').value});location.hash='#/tour/'+t.id};
}
async function editor(id){
  editMode=true;addMode=false;await load(id);
  $('#hdr').textContent=tour.title;
  $('#app').innerHTML=`<div class="edit"><div id="stage"></div><aside>
   <label class="b pri" style="text-align:center">Add 360° photos<input id="up" type="file" accept="image/*" multiple hidden></label>
   <div id="list" style="display:flex;flex-direction:column;gap:8px"></div>
   <div class="row"><select id="tgt"></select><button id="add">Add link</button></div>
   <small style="color:var(--mut)">Pick a target scene, press Add link, then click a spot in the view. In link mode, click a link to remove it.</small>
   <b>Share</b><div class="row"><a class="b" id="open" target="_blank">Open public page</a></div>
   <textarea id="emb" rows="3" readonly></textarea>
   <button id="del">Delete tour</button></aside></div>`;
  viewer($('#stage'));
  onClick=(lo,la)=>{if(!addMode)return;const s=tour.scenes[cur],to=$('#tgt').value;if(!s||!to||to===s.id)return alert('Choose a different target scene');s.hotspots.push({lon:lo,lat:la,to});saveHs(s);showScene(cur)};
  const url=`${location.origin}/t/${id}`;$('#open').href=url;
  $('#emb').value=`<iframe src="${url}" width="100%" height="480" style="border:0" allowfullscreen></iframe>`;
  $('#up').onchange=async e=>{for(const f of e.target.files)await fetch(`/api/tours/${id}/scenes?name=${encodeURIComponent(f.name.replace(/\.[^.]+$/,''))}`,{method:'PUT',headers:{'Content-Type':f.type},body:f});e.target.value='';refresh(id)};
  $('#add').onclick=()=>{addMode=!addMode;$('#add').classList.toggle('pri',addMode);$('#stage').classList.toggle('add',addMode)};
  $('#del').onclick=async()=>{if(confirm('Delete this tour?')){await api('/api/tours/'+id,{method:'DELETE'});location.hash=''}};
  side();nav();showScene(0);
  clearInterval(poll);poll=setInterval(()=>{if(tour.scenes.some(s=>s.status==='queued'||s.status==='processing'))refresh(id)},2000);
}
async function refresh(id){const keep=tour.scenes[cur]?.id;await load(id);cur=Math.max(0,tour.scenes.findIndex(s=>s.id===keep));side();nav();showScene(cur)}
function side(){
  const l=$('#list');l.innerHTML='';
  tour.scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='sc'+(i===cur?' on':'');
    d.innerHTML=`<img alt="" ${s.status==='ready'?`src="/img/${s.id}/thumb"`:''}><span></span><em>${s.status}</em><button>×</button>`;
    d.querySelector('span').textContent=s.name;d.onclick=()=>{showScene(i);side()};
    d.querySelector('button').onclick=async e=>{e.stopPropagation();await api('/api/scenes/'+s.id,{method:'DELETE'});refresh(tour.id)};
    if(s.error){const x=document.createElement('div');x.className='err';x.textContent=s.error;d.after(x)}l.appendChild(d)});
  $('#tgt').innerHTML=tour.scenes.map(s=>`<option value="${s.id}"></option>`).join('');
  [...$('#tgt').options].forEach((o,i)=>o.textContent=tour.scenes[i].name);
}
async function load(id){tour=await api('/api/tours/'+id)}
async function publicView(id){
  editMode=false;await load(id);document.title=tour.title;document.querySelector('header').hidden=true;
  $('#app').innerHTML='<div id="stage"></div>';viewer($('#stage'));onClick=null;nav();showScene(0);
}
async function route(){
  const m=location.pathname.match(/^\/t\/(\w+)/);
  if(m)return publicView(m[1]).catch(()=>$('#app').textContent='Tour not found');
  const h=location.hash.match(/^#\/tour\/(\w+)/);
  h?editor(h[1]).catch(()=>location.hash=''):home();
}
addEventListener('hashchange',route);route();
</script></body></html>
