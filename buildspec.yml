# Optional: use when CodeBuild concurrent-build quota is > 0.
# Current prod pipeline is Source (GitHub) → Deploy (Elastic Beanstalk) only;
# the instance builds via .platform/hooks/predeploy/10_build.sh.
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - node -v
      - npm -v
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - npm prune --omit=dev

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - .git/**/*
    - .github/**/*
    - samples/**/*
    - docs/**/*
    - .env*
    - docker-compose.yml
    - render.yaml
